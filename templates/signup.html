<!DOCTYPE html>
<html>
<head>
    <title>Signup</title>
</head>
<body>

<h2>Signup</h2>

<form method="POST">
    {% csrf_token %}
    <input name="username" placeholder="Username"><br><br>
    <input name="password" type="password"><br><br>

    <select name="role">
        <option value="ADMIN">Admin</option>
        <option value="MEMBER">Member</option>
    </select><br><br>

    <button type="submit">Signup</button>
</form>

<a href="/">Login</a>

</body>
</html>
